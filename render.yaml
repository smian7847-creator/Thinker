# Render blueprint: the backend API and the frontend, both from the repo
# root so npm workspaces can link the shared package.
services:
  - type: web
    name: thinker-api
    runtime: node
    plan: free
    buildCommand: npm install && npm run build -w backend
    startCommand: npm run start -w backend
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: "1"
      # The local-dev MongoDB binary isn't needed on a host.
      - key: MONGOMS_DISABLE_POSTINSTALL
        value: "1"
      # Your MongoDB Atlas connection string, entered in the Render dashboard.
      - key: MONGO_URL
        sync: false

  - type: web
    name: thinker-web
    runtime: node
    plan: free
    buildCommand: npm install && npm run build -w frontend
    startCommand: npm run serve -w frontend
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: MONGOMS_DISABLE_POSTINSTALL
        value: "1"
      # The backend's public URL, e.g. https://thinker-api.onrender.com
      # (no trailing slash). Read at build time: redeploy after changing it.
      - key: API_URL
        sync: false
